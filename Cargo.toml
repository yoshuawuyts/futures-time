[package]
name = "futures-time"
version = "3.0.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoshuawuyts/futures-time"
documentation = "https://docs.rs/futures-time"
description = "async time combinators"
readme = "README.md"
edition = "2018"
keywords = []
categories = []
authors = ["Yoshua Wuyts <rust@yosh.is>"]

[features]
default = ["dep:async-io"]
web = ["dep:web-time", "dep:gloo-timers"]

[dependencies]
futures-core = "0.3.19"
pin-project-lite = "0.2.8"
async-channel = "1.6.1"
async-io = { version = "2.0.0", optional = true }
# For wasm32-unknown-unknown targets
web-time = { version = "1.1.0", optional = true }
gloo-timers = { version = "0.3", optional = true }

[dev-dependencies]
futures-lite = "2.6.0"
